services:
  mongodb:
    image: mongo:latest
    container_name: contenedor67
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build: .
    container_name: songsapp
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data: